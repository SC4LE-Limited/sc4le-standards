name: Export repository Markdown

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  export-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.x
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Ensure tools dir exists
        run: |
          mkdir -p tools

      - name: Syntax-check exporter
        run: |
          python -m py_compile tools/export_repo.py

      # Optional: run gitleaks (comment out if you don't want it)
      # - name: Run gitleaks scan (optional)
      #   uses: zricethezav/gitleaks-action@v2
      #   with:
      #     args: --path=. --verbose

      - name: Run markdown exporter
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          python tools/export_repo.py \
            --branch main \
            --output-dir ./repo-export-output \
            --part-prefix export_ \
            --part-size 1000000 \
            --max-size 1000000

      - name: Show export files
        run: |
          ls -la repo-export-output || true
          du -h repo-export-output/* || true

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-export
          path: repo-export-output/*
