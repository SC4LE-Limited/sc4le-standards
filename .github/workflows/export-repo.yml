name: Export repository snapshot

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run export script
        run: |
          python3 tools/export_repo.py --root . --output export.md --manifest-file export-manifest.json --max-size 2000000

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Add strip_large_and_svg_sections.py script
        run: |
          cat > tools/strip_large_and_svg_sections.py <<'PY'
          #!/usr/bin/env python3
          """
          Strip/replace embedded large binary-like sections (SVG/XML) from export parts.

          Usage:
            python3 tools/strip_large_and_svg_sections.py        # processes export_*.md in cwd
            python3 tools/strip_large_and_svg_sections.py export_001.md
          """
          import re
          import sys
          from pathlib import Path

          # Threshold in bytes: if metadata line "- size: N bytes" is > this, strip content
          SIZE_THRESHOLD = 200_000  # 200 KB

          # Patterns
          SECTION_SPLIT = re.compile(r'\n(?=<a name=")', re.M)
          PATH_RE = re.compile(r'^###\s+(?P<path>.+)$', re.M)
          SIZE_RE = re.compile(r'^\s*-\s*size:\s*(?P<size>\d+)\s*bytes', re.M)
          BLOB_SHA_RE = re.compile(r'\b[0-9a-fA-F]{16,}\b')
          ANGLE_RE = re.compile(r'[<>]')

          def process_text(text: str) -> str:
              parts = SECTION_SPLIT.split(text)
              if not parts:
                  return text
              header = parts[0]
              out_parts = [header.rstrip() + '\n']
              for sec in parts[1:]:
                  mpath = PATH_RE.search(sec)
                  path = mpath.group('path').strip() if mpath else None
                  msize = SIZE_RE.search(sec)
                  size = int(msize.group('size')) if msize else 0

                  strip = False
                  if path:
                      lower = path.lower()
                      if lower.endswith('.svg') or lower.endswith('.xml'):
                          strip = True
                  if size > SIZE_THRESHOLD:
                      strip = True

                  if strip:
                      anchor_line_end = sec.find('\n')
                      anchor_line = sec[:anchor_line_end] if anchor_line_end != -1 else sec
                      title_line = f"### {path}\n\n" if path else "### [REDACTED]\n\n"
                      placeholder = f"[REDACTED: content for {path or 'file'} omitted for upload safety]\n\n"
                      meta_lines = []
                      if size:
                          meta_lines.append(f"- original_size: {size} bytes\n")
                      meta_lines.append("- content_removed: true\n\n")
                      section_out = anchor_line + "\n\n" + title_line + "".join(meta_lines) + placeholder
                      section_out = BLOB_SHA_RE.sub('[REDACTED_HEX]', section_out)
                      section_out = ANGLE_RE.sub(lambda m: '&lt;' if m.group(0) == '<' else '&gt;', section_out)
                      out_parts.append(section_out)
                  else:
                      cleaned = BLOB_SHA_RE.sub('[REDACTED_HEX]', sec)
                      cleaned = ANGLE_RE.sub(lambda m: '&lt;' if m.group(0) == '<' else '&gt;', cleaned)
                      out_parts.append(cleaned)
              return ''.join(out_parts)

          def process_file(path: Path):
              txt = path.read_text(encoding='utf-8', errors='ignore')
              out_txt = process_text(txt)
              out_path = path.with_name(path.stem + '_stripped' + path.suffix)
              out_path.write_text(out_txt, encoding='utf-8')
              print(f"Wrote {out_path} ({len(out_txt.encode('utf-8'))} bytes)")

          def main():
              args = sys.argv[1:]
              if args:
                  files = [Path(f) for f in args]
              else:
                  files = sorted(Path('.').glob('export_*.md'))
              if not files:
                  print("No export_*.md files found.")
                  sys.exit(1)
              for f in files:
                  process_file(f)

          if __name__ == '__main__':
              main()
          PY
          chmod +x tools/strip_large_and_svg_sections.py

      - name: Strip large/svg sections from parts
        run: |
          python3 tools/strip_large_and_svg_sections.py

      - name: Sanitize manifest (remove blob_sha)
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open('export-manifest.json'))
          for f in m.get('files', []):
              f.pop('blob_sha', None)
          json.dump(m, open('export-manifest-sanitized.json','w'), indent=2)
          PY

      - name: Upload sanitized export artifact (stripped parts + sanitized manifest + gitleaks SARIF)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repo-export-sanitized
          path: |
            export_*_stripped.md
            export-manifest-sanitized.json
            results.sarif
