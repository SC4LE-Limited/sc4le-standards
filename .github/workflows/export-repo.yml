name: Export repo markdown

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  export-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify exporter syntax
        run: python -m py_compile tools/export_repo.py

      - name: Run markdown exporter
        run: |
          python tools/export_repo.py \
            --branch main \
            --max-size-bytes 1000000

      # -----------------------------
      # GITLEAKS v3 (license required)
      # -----------------------------
      - name: Run gitleaks (v3)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Upload export artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repo-export
          path: |
            export_*.md
            export-manifest.json
