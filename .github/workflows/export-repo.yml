name: Export repository snapshot

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Run export script
        run: |
          python3 tools/export_repo.py --root . --output export.md --manifest-file export-manifest.json --max-size 2000000

      - name: Run gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run preserve-and-sanitize
        run: |
          # ensure script is executable
          chmod +x tools/preserve_and_sanitize.py
          # run it (adjust --keep-code-lines if you'd like more preserved code context)
          python3 tools/preserve_and_sanitize.py --keep-code-lines 12

      - name: Sanitize manifest (remove blob_sha)
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              m = json.load(open('export-manifest.json'))
          except FileNotFoundError:
              print('export-manifest.json not found', file=sys.stderr)
              sys.exit(1)
          for f in m.get('files', []):
              f.pop('blob_sha', None)
          json.dump(m, open('export-manifest-sanitized.json','w'), indent=2)
          PY

      - name: Upload preserved export artifact (preserved parts + sanitized manifest + gitleaks SARIF)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repo-export-preserved
          path: |
            export_*_preserved.md
            export-manifest-sanitized.json
            results.sarif
