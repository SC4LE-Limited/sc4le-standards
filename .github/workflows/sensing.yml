name: SC4LE Sensing Engine

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-sensing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PyYAML
        run: |
          pip3 install pyyaml

      - name: Run sensing engine
        run: |
          python3 ai-assisted-sensing/sense.py

      - name: Configure Git identity
        run: |
          git config --global user.name "SC4LE Sensing Engine"
          git config --global user.email "sensing@sc4le.co.uk"

      - name: Stage sensing updates
        run: |
          git add ai-assisted-sensing/adaptation-log.md
          git add ai-assisted-sensing/outcome-dashboard.md

      - name: Commit sensing updates
        run: |
          git commit -m "SC4LE Sensing Update: automated log + dashboard refresh" || echo "No changes to commit"

      - name: Pull latest changes (safe merge)
        run: |
          git pull --no-rebase --strategy=recursive --strategy-option=theirs

      - name: Push updates
        run: |
          git push
